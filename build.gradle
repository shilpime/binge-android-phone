// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext{
        kotlin_version = '1.6.0'
    //testing libraries
        junit_x_ext = '1.1.3'
        testx_rules = '1.4.0'
        android_arch_core_testing = '1.1.1'
        retrofit_mock = '2.3.0'
        mockwebserver_version = '4.1.0'
        espresso_contrib = '3.4.0'
    }
    repositories {
        google()
        jcenter()
        //Juspay dependency, Place it above any other maven repo
        maven {
            url "https://maven.juspay.in/jp-build-packages/hypersdk-asset-download/releases/"
        }

        maven { url "https://kotlin.bintray.com/kotlinx/" }
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.0.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.6.0"
        classpath 'androidx.navigation:navigation-safe-args-gradle-plugin:2.3.1'
        classpath 'com.github.dcendents:android-maven-gradle-plugin:2.1'
        classpath 'com.google.gms:google-services:4.3.4'
        classpath 'com.google.firebase:perf-plugin:1.3.2'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.2'
        classpath 'com.novoda:bintray-release:0.3.4'
        classpath "org.sonarsource.scanner.gradle:sonarqube-gradle-plugin:2.6.2"
        classpath "com.dicedmelon.gradle:jacoco-android:0.1.1"
        //Juspay plugin
        classpath 'in.juspay:hypersdk-asset-plugin:1.0.3'
    }
    apply plugin: 'maven-publish'
}

allprojects {
    repositories {
        google()
        //MX Player dependecy
//        maven {
//            allowInsecureProtocol true
//            url "http://13.232.78.227:8099/nexus/content/repositories/public/"
//        }
        jcenter()
        maven { url 'https://maven.microblink.com' }
        maven { url 'https://jitpack.io' }
        maven {
            url "https://plugins.gradle.org/m2/"
        }
        maven {
            url 'https://raw.github.com/logituitrel/logixplayer-android/upgrade'
        }
        mavenCentral()
        maven {
            url "https://maven.juspay.in/jp-build-packages/hyper-sdk/"
        }
    }
}

